<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Депозити"><meta name="theme-color" content="#1E6A4A">
<style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Депозитний облік</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column like a bank passbook; list → deposit page → bottom sheets for input */
:root{
  --bg:#EEF2EE; --surface:#FFFFFF; --ink:#13241C; --muted:#5E6E65; --line:#D6DFD8;
  --accent:#1E6A4A; --accent-ink:#FFFFFF; --brass:#9A7230; --soft:#E2EBE4;
  --plus:#1E6A4A; --minus:#B3402E; --shade:rgba(10,25,18,.45);
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1713; --surface:#16231D; --ink:#E4EEE7; --muted:#93A69A; --line:#26372E;
  --accent:#5CC594; --accent-ink:#0B1A12; --brass:#D2A65A; --soft:#1D2F26;
  --plus:#5CC594; --minus:#EE8270; --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1713; --surface:#16231D; --ink:#E4EEE7; --muted:#93A69A; --line:#26372E;
  --accent:#5CC594; --accent-ink:#0B1A12; --brass:#D2A65A; --soft:#1D2F26;
  --plus:#5CC594; --minus:#EE8270; --shade:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:16px 110px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:700;font-size:1.35rem;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-weight:500;font-size:1.05rem}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 18px}
.sync{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--brass)}
.dot.ok{background:var(--plus)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--soft);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:transparent;color:var(--minus);border:1px solid var(--minus)}
.btn.ghost{background:transparent;padding:8px 10px}
.btn.block{width:100%}
.total{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:18px;display:grid;gap:4px;margin-bottom:18px}
.total .big{font-family:var(--f-num);font-size:1.7rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.total .label{color:inherit;opacity:.8}
.total .row{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.88rem;opacity:.92}
.list{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;text-align:left;width:100%}
.card .head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card .name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.chip{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.ex{color:var(--brass)}
.chip.done{color:var(--minus)}
.pair{display:flex;justify-content:space-between;gap:10px;font-size:.92rem}
.pos{color:var(--plus)} .neg{color:var(--minus)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;display:grid;gap:12px;text-align:center}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(528px,calc(100% - 32px));box-shadow:0 6px 20px var(--shade);z-index:5}
.back{display:inline-flex;align-items:center;gap:6px;margin-left:-10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-block:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:2px;min-width:0}
.stat .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:1.02rem;overflow-wrap:anywhere}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-size:.88rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px var(--shade)}
.section{display:grid;gap:10px;margin-top:22px}
.section .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ops{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.op{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:11px 8px 11px 14px;border-top:1px solid var(--line)}
.op:first-child{border-top:0}
.op .t{min-width:0}
.op .d{font-size:.8rem;color:var(--muted)}
.x{border:0;background:transparent;color:var(--muted);width:36px;height:36px;border-radius:8px;font-size:1.2rem;line-height:1}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{padding:9px 12px;text-align:right;white-space:nowrap}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{font-family:var(--f-num);font-variant-numeric:tabular-nums;border-top:1px solid var(--line)}
tr:first-child td{border-top:0}
.note{font-size:.8rem;color:var(--muted)}
/* sheet */
.shade{position:fixed;inset:0;background:var(--shade);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;max-height:92%;overflow-y:auto}
.sheet .grip{width:40px;height:4px;border-radius:4px;background:var(--line);margin:-8px auto 0}
.field{display:grid;gap:6px}
.field label{font-size:.82rem;font-weight:600;color:var(--muted)}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row-btns{display:flex;gap:10px}
.row-btns .btn{flex:1}
.check{display:flex;gap:10px;align-items:center;font-size:.92rem}
.check input{width:22px;height:22px}
.err{color:var(--minus);font-size:.85rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.88rem;z-index:20}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.4}}}
</style>

<div class="wrap" id="app"></div>
<div id="layer"></div>

<script>
(function(){
const LS='deposit-ledger-v1';
const DAY=86400000;
let store={deposits:[]};
let dbRef=null, synced=false, saving=Promise.resolve(), saveTimer=null;
let view={screen:'list',id:null,mode:'today'};

/* ---------- dates ---------- */
const toDay=s=>{const [y,m,d]=s.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/DAY)};
const fromDay=n=>new Date(n*DAY).toISOString().slice(0,10);
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtDate=s=>{const [y,m,d]=s.split('-');return d+'.'+m+'.'+y};
const MONTHS=['січ','лют','бер','кві','тра','чер','лип','сер','вер','жов','лис','гру'];
const isLeap=y=>(y%4===0&&y%100!==0)||y%400===0;
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);

/* ---------- money ---------- */
const SYM={UAH:'₴',USD:'$',EUR:'€'};
const money=(v,c)=>new Intl.NumberFormat('uk-UA',{minimumFractionDigits:2,maximumFractionDigits:2}).format(v)+' '+(SYM[c]||c);
const pct=v=>new Intl.NumberFormat('uk-UA',{maximumFractionDigits:3}).format(v)+'%';
const parseNum=s=>{const n=parseFloat(String(s).replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:NaN};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- interest engine ----------
   Interest accrues daily: balance × rate / 100 / days-in-year.
   Periods run from the opening date: a deposit opened on the 15th is
   credited every month on the 15th (on the last day of shorter months).
   At each credit date interest is either added to the balance
   (capitalization) or paid out. Tax is withheld from every credit.
   On the closing date everything accrued is credited. */
const dim=(y,m)=>new Date(Date.UTC(y,m,0)).getUTCDate();
function isAnniv(dayNum,startStr){
  const s=fromDay(dayNum),y=+s.slice(0,4),m=+s.slice(5,7),dd=+s.slice(8,10);
  return dd===Math.min(+startStr.slice(8,10),dim(y,m));
}
function calc(dep,untilStr){
  const ops=[...dep.ops].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const start=toDay(dep.start);
  const until=toDay(untilStr);
  const endDay=dep.end?toDay(dep.end):null;
  const tax=(dep.taxOn?dep.tax:0)/100;
  let bal=0,rate=dep.rate,acc=0,gross=0,paidOut=0,inSum=0,outSum=0;
  const periods=[];let cur=null;
  let i=0;
  for(let d=start;d<=until;d++){
    const ds=fromDay(d),y=+ds.slice(0,4);
    if(!cur){cur={from:ds,to:ds,in:0,out:0,interest:0,credited:0,bal:0,rate,open:true};periods.push(cur)}
    while(i<ops.length&&ops[i].date<=ds){
      const o=ops[i++];
      if(o.date<dep.start) continue;
      if(o.type==='in'){bal+=o.amount;inSum+=o.amount;cur.in+=o.amount}
      else if(o.type==='out'){bal-=o.amount;outSum+=o.amount;cur.out+=o.amount}
      else if(o.type==='rate'){rate=o.amount}
    }
    cur.to=ds;cur.rate=rate;
    if(d<until){ // interest for the day itself; the final day is the cut-off
      const day=bal>0?bal*rate/100/(isLeap(y)?366:365):0;
      acc+=day;cur.interest+=day;gross+=day;
    }
    const close=(d<until&&isAnniv(d+1,dep.start))||(d===until&&d===endDay);
    if(close){
      const net=acc*(1-tax);
      if(dep.cap==='monthly') bal+=net; else paidOut+=net;
      cur.credited=net;cur.open=false;acc=0;
    }
    cur.bal=bal;
    if(close&&d<until){cur.creditDate=fromDay(d+1);cur=null}
    else if(close) cur.creditDate=ds;
  }
  // a closing date that falls on a credit date leaves an empty one-day period behind
  const last=periods[periods.length-1];
  if(periods.length>1&&last&&last.from===last.to&&!last.interest&&!last.in&&!last.out) periods.pop();
  const taxSum=gross*tax;
  const pending=acc*(1-tax);
  let nextCredit=null;
  if(pending>0){for(let d=until+1;d<until+40;d++){if(isAnniv(d,dep.start)||d===endDay){nextCredit=fromDay(d);break}}}
  return {bal,gross,taxSum,net:gross-taxSum,paidOut,pending,nextCredit,inSum,outSum,rate,periods};
}

function targetDate(dep,mode){
  const t=todayStr();
  if(mode==='end'&&dep.end) return dep.end;
  if(dep.end&&dep.end<t) return dep.end;
  return t<dep.start?dep.start:t;
}

/* ---------- storage ---------- */
function loadLocal(){try{const s=JSON.parse(localStorage.getItem(LS)||'null');if(s&&Array.isArray(s.deposits))return s}catch(e){}return null}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(store))}catch(e){}}
function persist(){
  saveLocal();
  if(!dbRef) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    const snapshot=JSON.parse(JSON.stringify(store));
    saving=saving.then(()=>dbRef.set(snapshot)).then(()=>{synced=true;renderSync()}).catch(e=>{synced=false;renderSync();toast('Не вдалося зберегти в акаунті. Дані лишились на цьому пристрої.')});
  },400);
}
async function initDb(){
  if(!window.claude||!window.claude.use) return;
  try{
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user) return;
    const id=await user.id();
    if(!id) return;
    dbRef=db.doc('data/users/'+id+'/ledger');
    const snap=await dbRef.get();
    if(snap.exists&&Array.isArray((snap.data()||{}).deposits)){
      store=JSON.parse(JSON.stringify(snap.data()));saveLocal();
    }else if(store.deposits.length){
      await dbRef.set(JSON.parse(JSON.stringify(store)));
    }
    synced=true;render();
  }catch(e){dbRef=null;renderSync()}
}

/* ---------- sample ---------- */
function sample(){
  const t=new Date();const y=t.getFullYear()-1,mm=String(t.getMonth()+1).padStart(2,'0');
  const s=y+'-'+mm+'-01';
  const add=(n,days)=>fromDay(toDay(s)+days);
  return {id:uid(),name:'Приклад: строковий депозит',example:true,currency:'UAH',rate:14,cap:'monthly',taxOn:true,tax:23,
    start:s,end:fromDay(toDay(s)+730),
    ops:[{id:uid(),type:'in',date:s,amount:50000},{id:uid(),type:'in',date:add(0,61),amount:10000},
         {id:uid(),type:'rate',date:add(0,150),amount:13.5},{id:uid(),type:'in',date:add(0,200),amount:15000},
         {id:uid(),type:'out',date:add(0,280),amount:5000}]};
}

/* ---------- render ---------- */
const app=document.getElementById('app'),layer=document.getElementById('layer');
function renderSync(){const el=document.getElementById('sync');if(el)el.innerHTML=syncHtml()}
function syncHtml(){return dbRef&&synced?'<span class="dot ok"></span>Збережено в акаунті':'<span class="dot"></span>Збережено на цьому пристрої'}

function render(){view.screen==='deposit'&&getDep(view.id)?renderDeposit():renderList()}
const getDep=id=>store.deposits.find(d=>d.id===id);

function renderList(){
  view.screen='list';
  const deps=store.deposits;
  const byCur={};
  const rows=deps.map(d=>{
    const r=calc(d,targetDate(d,'today'));
    const c=byCur[d.currency]||(byCur[d.currency]={bal:0,net:0});
    c.bal+=r.bal;c.net+=r.net;
    const closed=d.end&&d.end<todayStr();
    return `<button class="card" data-open="${d.id}">
      <div class="head"><span class="name">${esc(d.name)}</span>
      ${d.example?'<span class="chip ex">приклад</span>':closed?'<span class="chip done">завершено</span>':`<span class="chip">${pct(r.rate)}</span>`}</div>
      <div class="pair"><span class="muted">Сума на рахунку</span><span class="num">${money(r.bal,d.currency)}</span></div>
      <div class="pair"><span class="muted">Чистий дохід</span><span class="num pos">+${money(r.net,d.currency)}</span></div>
    </button>`}).join('');
  const totals=Object.entries(byCur);
  app.innerHTML=`
    <header class="top"><h1>Депозити</h1><span class="sync" id="sync">${syncHtml()}</span></header>
    ${totals.length?totals.map(([c,v])=>`<div class="total"><span class="label">Разом на сьогодні · ${c}</span>
      <span class="big">${money(v.bal,c)}</span>
      <div class="row"><span>Дохід після податку: +${money(v.net,c)}</span></div></div>`).join(''):''}
    ${deps.length?`<div class="list">${rows}</div><button class="btn block" id="xlsxAll" style="margin-top:14px">Вивантажити все в Excel</button>`:`
      <div class="empty"><h2>Тут з'являться ваші депозити</h2>
      <p class="muted" style="margin:0">Додайте депозит, вкажіть ставку і вносьте поповнення. Відсотки рахуються щодня автоматично.</p>
      <button class="btn" id="demo">Показати приклад</button></div>`}
    <button class="btn primary fab" id="addDep">+ Новий депозит</button>`;
  app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{view={screen:'deposit',id:b.dataset.open,mode:'today'};render();scrollTo(0,0)});
  document.getElementById('addDep').onclick=()=>depSheet();
  const xa=document.getElementById('xlsxAll');
  if(xa) xa.onclick=()=>exportXlsx(store.deposits);
  const demo=document.getElementById('demo');
  if(demo) demo.onclick=()=>{store.deposits.push(sample());persist();render()};
}

function renderDeposit(){
  const d=getDep(view.id);
  const until=targetDate(d,view.mode);
  const r=calc(d,until);
  const c=d.currency;
  const ops=[...d.ops].sort((a,b)=>a.date<b.date?1:-1);
  const opName={in:'Поповнення',out:'Зняття',rate:'Нова ставка'};
  const opVal=o=>o.type==='rate'?`<span class="num">${pct(o.amount)}</span>`:o.type==='in'?`<span class="num pos">+${money(o.amount,c)}</span>`:`<span class="num neg">−${money(o.amount,c)}</span>`;
  const periods=r.periods.slice().reverse();
  const short=s=>s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(2,4);
  app.innerHTML=`
    <header class="top"><button class="btn ghost back" id="back">← Усі депозити</button><span class="sync" id="sync">${syncHtml()}</span></header>
    <div style="display:grid;gap:4px;margin-bottom:14px">
      <h1>${esc(d.name)}</h1>
      <span class="muted" style="font-size:.88rem">${fmtDate(d.start)}${d.end?' – '+fmtDate(d.end):''} · ${d.cap==='monthly'?'капіталізація щомісяця':'без капіталізації'} · ${d.taxOn?'податок '+pct(d.tax):'без податку'}</span>
    </div>
    ${d.end?`<div class="seg" role="group" aria-label="Період розрахунку">
      <button aria-pressed="${view.mode==='today'}" data-mode="today">На сьогодні</button>
      <button aria-pressed="${view.mode==='end'}" data-mode="end">На кінець строку</button></div>`:''}
    <div class="total" style="margin-top:14px;margin-bottom:0"><span class="label">Сума на ${fmtDate(until)}</span>
      <span class="big">${money(r.bal,c)}</span>
      <div class="row"><span>Ставка зараз: ${pct(r.rate)}</span>${d.cap!=='monthly'?`<span>Виплачено відсотків: ${money(r.paidOut,c)}</span>`:''}</div>
      ${r.pending>0?`<div class="row"><span>Ще нараховано ${money(r.pending,c)}, буде зараховано ${r.nextCredit?fmtDate(r.nextCredit):'в день виплати'}</span></div>`:''}</div>
    <div class="stats">
      <div class="stat"><span class="label">Внесено</span><span class="v">${money(r.inSum,c)}</span></div>
      <div class="stat"><span class="label">Знято</span><span class="v">${money(r.outSum,c)}</span></div>
      <div class="stat"><span class="label">Нараховано</span><span class="v">${money(r.gross,c)}</span></div>
      <div class="stat"><span class="label">Податок</span><span class="v">${money(r.taxSum,c)}</span></div>
      <div class="stat" style="grid-column:1/-1"><span class="label">Чистий дохід</span><span class="v pos">+${money(r.net,c)}</span></div>
    </div>
    <div class="row-btns">
      <button class="btn primary" data-add="in">+ Поповнити</button>
      <button class="btn" data-add="out">− Зняти</button>
      <button class="btn" data-add="rate">% Ставка</button>
    </div>
    <div class="section"><div class="h"><h2>Операції</h2><span class="note">${d.ops.length}</span></div>
      <div class="ops">${ops.length?ops.map(o=>`<div class="op"><div class="t"><div>${opName[o.type]}${o.note?' · '+esc(o.note):''}</div><div class="d">${fmtDate(o.date)}</div></div>${opVal(o)}<button class="x" aria-label="Видалити операцію" data-del="${o.id}">×</button></div>`).join(''):'<div class="op"><span class="muted">Поки немає операцій. Почніть з першого внеску.</span></div>'}</div>
    </div>
    <div class="section"><h2>По періодах</h2>
      <div class="tablewrap"><table><thead><tr><th>Період</th><th>Рух</th><th>Нараховано</th><th>Зараховано</th><th>Ставка</th><th>Залишок</th></tr></thead><tbody>
      ${periods.map(p=>{const mv=p.in-p.out;return `<tr><td>${short(p.from)} – ${short(p.to)}${p.open?' <span class="chip">поточний</span>':''}</td><td class="${mv>0?'pos':mv<0?'neg':''}">${mv?(mv>0?'+':'−')+money(Math.abs(mv),c):'—'}</td><td>${money(p.interest,c)}</td><td>${p.open?'—':money(p.credited,c)}</td><td>${pct(p.rate)}</td><td>${money(p.bal,c)}</td></tr>`}).join('')}
      </tbody></table></div>
      <p class="note" style="margin:0">Період триває від дати відкриття до того ж числа наступного місяця. «Нараховано» показано до податку, «Зараховано» після податку.</p>
    </div>
    <div class="section"><button class="btn block" data-xlsx="one">Вивантажити в Excel</button>
      <div class="row-btns"><button class="btn" id="edit">Налаштування</button><button class="btn danger" id="del">Видалити депозит</button></div></div>`;
  app.querySelector('[data-xlsx]').onclick=()=>exportXlsx([d]);
  document.getElementById('back').onclick=()=>{view={screen:'list'};render()};
  app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{view.mode=b.dataset.mode;render()});
  app.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>opSheet(d,b.dataset.add));
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>confirmSheet('Видалити цю операцію?','Видалити',()=>{d.ops=d.ops.filter(o=>o.id!==b.dataset.del);persist();render()}));
  document.getElementById('edit').onclick=()=>depSheet(d);
  document.getElementById('del').onclick=()=>confirmSheet(`Видалити «${esc(d.name)}» разом з усіма операціями?`,'Видалити депозит',()=>{store.deposits=store.deposits.filter(x=>x.id!==d.id);persist();view={screen:'list'};render()});
}

/* ---------- sheets ---------- */
function openSheet(html,onReady){
  layer.innerHTML=`<div class="shade" id="shade"><form class="sheet" id="sheet" novalidate><div class="grip"></div>${html}</form></div>`;
  const shade=document.getElementById('shade');
  shade.onclick=e=>{if(e.target===shade)closeSheet()};
  layer.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheet);
  onReady(document.getElementById('sheet'));
  const f=layer.querySelector('input');if(f&&matchMedia('(pointer:fine)').matches)f.focus();
}
function closeSheet(){layer.innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

function depSheet(d){
  const isNew=!d;
  d=d||{name:'',currency:'UAH',rate:'',cap:'monthly',taxOn:true,tax:23,start:todayStr(),end:''};
  const firstIn=isNew?'':null;
  openSheet(`
    <h2>${isNew?'Новий депозит':'Налаштування депозиту'}</h2>
    <div class="field"><label for="f-name">Назва</label><input id="f-name" value="${esc(d.name)}" placeholder="Напр. ПриватБанк, 12 міс."></div>
    <div class="two">
      <div class="field"><label for="f-rate">${isNew?'Ставка, % річних':'Початкова ставка, %'}</label><input id="f-rate" inputmode="decimal" value="${d.rate}" placeholder="14,5"></div>
      <div class="field"><label for="f-cur">Валюта</label><select id="f-cur">${['UAH','USD','EUR'].map(c=>`<option ${c===d.currency?'selected':''}>${c}</option>`).join('')}</select></div>
    </div>
    ${isNew?`<div class="field"><label for="f-amt">Перший внесок</label><input id="f-amt" inputmode="decimal" placeholder="50 000"></div>`:''}
    <div class="two">
      <div class="field"><label for="f-start">Дата відкриття</label><input id="f-start" type="date" value="${d.start}"></div>
      <div class="field"><label for="f-end">Дата завершення</label><input id="f-end" type="date" value="${d.end||''}"></div>
    </div>
    <div class="field"><label for="f-cap">Нарахування відсотків</label><select id="f-cap">
      <option value="monthly" ${d.cap==='monthly'?'selected':''}>Щомісяця додаються до суми (капіталізація)</option>
      <option value="none" ${d.cap!=='monthly'?'selected':''}>Виплачуються окремо (без капіталізації)</option></select></div>
    <div class="two" style="align-items:end">
      <label class="check"><input type="checkbox" id="f-taxon" ${d.taxOn?'checked':''}> Утримувати податок</label>
      <div class="field"><label for="f-tax">Податок, %</label><input id="f-tax" inputmode="decimal" value="${d.tax}"></div>
    </div>
    <p class="note" style="margin:0">В Україні з доходу за депозитом утримують 18% ПДФО і 5% військового збору, разом 23%.</p>
    <div class="err" id="f-err" hidden></div>
    <div class="row-btns"><button type="button" class="btn" data-close>Скасувати</button><button class="btn primary">${isNew?'Створити':'Зберегти'}</button></div>`,
  form=>form.onsubmit=e=>{
    e.preventDefault();
    const v=id=>document.getElementById(id).value.trim();
    const err=m=>{const el=document.getElementById('f-err');el.textContent=m;el.hidden=false};
    const rate=parseNum(v('f-rate')),tax=parseNum(v('f-tax'));
    if(!v('f-name')) return err('Вкажіть назву депозиту.');
    if(!(rate>=0&&rate<1000)) return err('Вкажіть ставку числом, напр. 14,5.');
    if(!v('f-start')) return err('Вкажіть дату відкриття.');
    if(v('f-end')&&v('f-end')<=v('f-start')) return err('Дата завершення має бути пізніше за дату відкриття.');
    if(!(tax>=0&&tax<100)) return err('Податок має бути від 0 до 99%.');
    let amt=0;
    if(isNew){amt=parseNum(v('f-amt'));if(!(amt>0)) return err('Вкажіть суму першого внеску.')}
    const data={name:v('f-name'),rate,currency:v('f-cur'),start:v('f-start'),end:v('f-end')||'',cap:v('f-cap'),taxOn:document.getElementById('f-taxon').checked,tax};
    if(isNew){
      const dep={id:uid(),...data,ops:[{id:uid(),type:'in',date:data.start,amount:amt}]};
      store.deposits.push(dep);view={screen:'deposit',id:dep.id,mode:'today'};
    }else{Object.assign(d,data);delete d.example}
    persist();closeSheet();render();toast(isNew?'Депозит створено':'Збережено');
  });
}

function opSheet(d,type){
  const t={in:['Поповнення','Сума поповнення'],out:['Зняття','Сума зняття'],rate:['Зміна ставки','Нова ставка, % річних']}[type];
  openSheet(`
    <h2>${t[0]}</h2>
    <div class="two">
      <div class="field"><label for="o-amt">${t[1]}</label><input id="o-amt" inputmode="decimal" placeholder="${type==='rate'?'13,5':'10 000'}"></div>
      <div class="field"><label for="o-date">Дата</label><input id="o-date" type="date" value="${todayStr()<d.start?d.start:todayStr()}"></div>
    </div>
    <div class="field"><label for="o-note">Примітка (необов'язково)</label><input id="o-note" placeholder="${type==='rate'?'Рішення банку':'Напр. зарплата'}"></div>
    <div class="err" id="o-err" hidden></div>
    <div class="row-btns"><button type="button" class="btn" data-close>Скасувати</button><button class="btn primary">Додати</button></div>`,
  form=>form.onsubmit=e=>{
    e.preventDefault();
    const err=m=>{const el=document.getElementById('o-err');el.textContent=m;el.hidden=false};
    const amt=parseNum(document.getElementById('o-amt').value),date=document.getElementById('o-date').value;
    if(!(type==='rate'?amt>=0&&amt<1000:amt>0)) return err(type==='rate'?'Вкажіть ставку числом.':'Вкажіть суму більше нуля.');
    if(!date) return err('Вкажіть дату.');
    if(date<d.start) return err('Дата не може бути раніше відкриття депозиту ('+fmtDate(d.start)+').');
    if(type==='out'){const bal=calc(d,date).bal;if(amt>bal+0.005) return err('На цю дату на рахунку лише '+money(bal,d.currency)+'.')}
    d.ops.push({id:uid(),type,date,amount:amt,note:document.getElementById('o-note').value.trim()});
    persist();closeSheet();render();toast('Додано');
  });
}

function confirmSheet(text,label,fn){
  openSheet(`<h2>${text}</h2><p class="muted" style="margin:0">Цю дію не можна скасувати.</p>
    <div class="row-btns"><button type="button" class="btn" data-close>Скасувати</button><button class="btn danger">${label}</button></div>`,
  form=>form.onsubmit=e=>{e.preventDefault();fn();closeSheet()});
}

let toastT;
function toast(m){let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=m;clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),2200)}

/* ---------- Excel export ---------- */
let xlsxLib=null;
function loadXlsx(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(xlsxLib) return xlsxLib;
  xlsxLib=new Promise((res,rej)=>{const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=()=>res(window.XLSX);s.onerror=()=>{xlsxLib=null;rej(new Error('load'))};document.head.appendChild(s)});
  return xlsxLib;
}
const r2=v=>Math.round(v*100)/100;
async function exportXlsx(deps){
  let downloads=null;
  try{downloads=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
  let X;
  try{X=await loadXlsx()}catch(e){return toast('Не вдалося підготувати Excel. Перевірте інтернет і спробуйте ще раз.')}
  const wb=X.utils.book_new();
  const t=todayStr();
  const cap=d=>d.cap==='monthly'?'капіталізація':'виплата окремо';
  const summary=[['Депозити на '+fmtDate(t)],[],
    ['Назва','Валюта','Відкрито','Завершення','Ставка зараз, %','Нарахування','Податок, %','Внесено','Знято','Нараховано (брутто)','Податок','Чистий дохід','Сума на рахунку','Сума на кінець строку']];
  const used=new Set(['Зведення']);
  const sheetName=n=>{let b=n.replace(/[\[\]:*?\/\\]/g,' ').trim().slice(0,28)||'Депозит',s=b,k=2;while(used.has(s))s=b.slice(0,25)+' ('+(k++)+')';used.add(s);return s};
  const perSheets=[];
  deps.forEach(d=>{
    const r=calc(d,targetDate(d,'today'));
    const rEnd=d.end?calc(d,d.end):null;
    summary.push([d.name,d.currency,fmtDate(d.start),d.end?fmtDate(d.end):'',r.rate,cap(d),d.taxOn?d.tax:0,r2(r.inSum),r2(r.outSum),r2(r.gross),r2(r.taxSum),r2(r.net),r2(r.bal),rEnd?r2(rEnd.bal):'']);
    const opName={in:'Поповнення',out:'Зняття',rate:'Нова ставка, %'};
    const rows=[[d.name],['Валюта',d.currency],['Відкрито',fmtDate(d.start)],['Завершення',d.end?fmtDate(d.end):'—'],
      ['Нарахування',cap(d)+', щомісяця в день відкриття'],['Податок, %',d.taxOn?d.tax:0],
      ['Сума на рахунку на '+fmtDate(targetDate(d,'today')),r2(r.bal)],['Чистий дохід',r2(r.net)],[],
      ['Операції'],['Дата','Тип','Сума / ставка','Примітка']];
    [...d.ops].sort((a,b)=>a.date<b.date?-1:1).forEach(o=>rows.push([fmtDate(o.date),opName[o.type],o.type==='out'?-o.amount:o.amount,o.note||'']));
    const src=rEnd||r;
    rows.push([],['По періодах'+(rEnd?' (до кінця строку)':'')],['З','По','Поповнення','Зняття','Ставка, %','Нараховано (брутто)','Зараховано (після податку)','Залишок']);
    src.periods.forEach(p=>rows.push([fmtDate(p.from),fmtDate(p.to),r2(p.in),r2(p.out),p.rate,r2(p.interest),p.open?'':r2(p.credited),r2(p.bal)]));
    const ws=X.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:22},{wch:16},{wch:16},{wch:16},{wch:10},{wch:18},{wch:22},{wch:16}];
    perSheets.push([sheetName(d.name),ws]);
  });
  const ws0=X.utils.aoa_to_sheet(summary);
  ws0['!cols']=summary[2].map((h,i)=>({wch:i===0?28:16}));
  X.utils.book_append_sheet(wb,ws0,'Зведення');
  perSheets.forEach(([n,ws])=>X.utils.book_append_sheet(wb,ws,n));
  const buf=X.write(wb,{bookType:'xlsx',type:'array'});
  const fname=(deps.length===1?deps[0].name.replace(/[\\\/:*?"<>|]/g,' ').trim():'Депозити')+' '+fmtDate(t)+'.xlsx';
  if(!downloads){ // standalone file opened in a regular browser
    try{X.writeFile(wb,fname);toast('Файл збережено')}catch(e){toast('Не вдалося зберегти файл.')}
    return;
  }
  try{await downloads.save({filename:fname,data:new Blob([buf])});toast('Файл збережено')}
  catch(e){
    if(e&&e.code==='declined') return;
    if(e&&e.code==='rate_limited') return toast('Збереження вже відкрито. Завершіть його і спробуйте ще раз.');
    toast('Не вдалося зберегти файл.');
  }
}

const local=loadLocal();if(local)store=local;
render();
initDb();
})();
